---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# Raspberry Pi Dashboard

- Infrastructure:
    - CPU:
        icon: mdi-cpu-64-bit
        description: Processor utilization
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: cpu

    - Memory:
        icon: mdi-memory
        description: RAM and swap usage
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: memory

    - Temperature:
        icon: mdi-thermometer
        description: Raspberry Pi CPU temperature
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: "sensor:cpu_thermal 0"

    - Network:
        icon: mdi-lan
        description: Ethernet network traffic
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: "network:eth0"

    - SD Card:
        icon: mdi-sd
        description: Raspberry Pi system storage
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: "fs:/etc/hostname"

    - External Drive:
        icon: mdi-harddisk
        description: USB media storage
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: "fs:/mnt/storage"

    - Pi-hole:
        icon: pi-hole.png
        href: http://pihole-server.local/admin/
        description: DNS and network management
        siteMonitor: http://192.168.0.2/admin/

    - File Server:
        icon: mdi-folder-network
        description: Samba network storage
        href: http://pihole-server.local:3000

    - Docker:
        icon: docker.png
        description: Container management
        href: http://pihole-server.local:3000

- Tailscale Network:
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: VPN and connected devices
        widget:
          type: customapi
          url: http://internet-status:8080/tailscale
          refreshInterval: 30000
          mappings:
            - field: online
              label: Online
            - field: total
              label: Total
            - field: active_peers
              label: Active

    - Connected Devices:
        icon: mdi-lan-connect
        description: Automatically discovered Tailscale devices
        widget:
          type: customapi
          url: http://internet-status:8080/tailscale
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: devices
            name: display_name
            label: status
            format: text

- Personal Services:
    - GitHub:
        icon: github.png
        href: https://github.com/dscottsalmon/pi-dashboard
        description: Pi Dashboard repository

    - YouTube:
        icon: youtube.png
        href: https://youtube.com
        description: Videos and subscriptions
