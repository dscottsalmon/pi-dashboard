services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "pihole-server.local:3000,localhost:3000,192.168.0.2:3000,100.93.56.57:3000,pihole-server:3000"
    volumes:
      - ./config:/app/config
      - /:/host-root:ro
      - /mnt/storage:/host-storage:ro
      - ./assets/icons:/app/public/icons/custom:ro
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      GLANCES_OPT: "-w"
    volumes:
      - /etc/os-release:/etc/os-release:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
      - /mnt/storage:/mnt/storage:ro

  internet-status:
    image: python:3.13-alpine
    container_name: internet-status
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "status_api.py"]
    environment:
          TAILSCALE_STATS_FILE: /stats/tailscale-stats.json
    volumes:
      - ./monitor/status_api.py:/app/status_api.py:ro
      - ./monitor/tailscale_stats.py:/app/tailscale_stats.py:ro
      - /var/lib/pi-dashboard:/data:ro
      - /var/lib/pi-dashboard/dashboard-stats:/stats
      - /var/lib/pi-dashboard/speedtest-requests:/speedtest-requests

  proxy:
    image: caddy:2-alpine
    container_name: dashboard-proxy
    restart: unless-stopped
    ports:
      - "192.168.0.2:3000:3000"
      - "100.93.56.57:3000:3000"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - homepage
      - internet-status
